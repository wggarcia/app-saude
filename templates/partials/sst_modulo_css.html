<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2233;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#e2eeff;--muted:#7b90b0;--teal:#00c9a7;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--green:#22c55e;--purple:#8b5cf6}
html,body{min-height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.app{display:flex;min-height:100vh;padding-top:52px}
.sidebar{width:200px;flex-shrink:0;background:rgba(17,24,39,.55);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 0;position:fixed;top:52px;bottom:0;overflow-y:auto}
.sb-label{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.sb-link{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:.77rem;font-weight:500;color:var(--muted);text-decoration:none;transition:all .12s;border-left:2px solid transparent}
.sb-link:hover{color:var(--text);background:rgba(255,255,255,.04)}
.sb-link.active{color:var(--teal);background:rgba(0,201,167,.06);border-left-color:var(--teal);font-weight:600}
.sb-icon{font-size:.95rem;flex-shrink:0;width:18px;text-align:center}
.main{flex:1;margin-left:200px;padding:24px;display:flex;flex-direction:column;gap:16px}
.page-eyebrow{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:5px}
.page-title{font-size:1.5rem;font-weight:800;line-height:1.2;margin-bottom:8px}
.page-sub{font-size:.82rem;color:var(--muted);line-height:1.6;max-width:660px}
.kpi-strip{display:flex;gap:10px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:150px;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--teal));opacity:.7}
.kpi-label{font-size:.62rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi-val{font-size:1.7rem;font-weight:900;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.panel-header h3{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btn-teal{padding:7px 14px;border-radius:7px;border:none;background:linear-gradient(135deg,var(--teal),#0077ff);color:#0a0e1a;font-size:.76rem;font-weight:800;cursor:pointer;font-family:inherit}
.btn-teal:hover{opacity:.88}
.btn-ghost{padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.tbl{width:100%;border-collapse:collapse}
.tbl thead th{padding:10px 14px;text-align:left;font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl tbody tr{border-bottom:1px solid var(--line)}.tbl tbody tr:last-child{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,.025)}
.tbl td{padding:11px 14px;font-size:.8rem;vertical-align:middle}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:.63rem;font-weight:800;text-transform:uppercase}
.b-verde{background:rgba(34,197,94,.1);color:#4ade80}.b-amarelo{background:rgba(245,158,11,.1);color:#fbbf24}.b-cinza{background:rgba(255,255,255,.05);color:var(--muted)}.b-azul{background:rgba(59,130,246,.1);color:#60a5fa}.b-vermelho{background:rgba(239,68,68,.1);color:#f87171}
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:.82rem}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;padding:24px 16px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:12px 18px;font-size:.82rem;font-weight:600;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}.toast.ok{border-color:rgba(34,197,94,.3);color:#4ade80}.toast.err{border-color:rgba(239,68,68,.3);color:#f87171}
.field{margin-bottom:12px}.field label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:.82rem;font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:3px}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0}}
</style>
