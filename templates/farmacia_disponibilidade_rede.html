<!DOCTYPE html>
<html lang="pt-BR">
<head>
{% include "_favicon.html" %}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disponibilidade na Rede</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#041018;--surface:#072030;--surface2:#0a2d45;--accent:#00c2ff;--accent2:#00e5b0;--danger:#ff4d6d;--warn:#ffb347;--ok:#00e5b0;--text:#e8f4ff;--muted:#7a9bb5;--radius:12px;--card:rgba(255,255,255,.04);--border:rgba(255,255,255,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:240px;min-height:100vh;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;position:sticky;top:0}
.logo{padding:0 20px 24px;font-size:18px;font-weight:800;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-section{padding:8px 12px 4px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:8px;margin:2px 8px;transition:.15s}
.nav-link:hover,.nav-link.active{background:rgba(0,194,255,.1);color:var(--accent)}
.nav-link span{font-size:16px}
.sidebar-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.nav-link-logout{background:rgba(255,77,109,.12);color:var(--danger);border:1px solid rgba(255,77,109,.35)}
.nav-link-logout:hover{background:rgba(255,77,109,.2)}
.main{flex:1;overflow:auto;padding:28px 32px;display:flex;flex-direction:column;gap:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:800}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--text);font-family:Manrope,sans-serif;outline:none}
.search-row input:focus{border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:rgba(255,255,255,.02)}
td{padding:12px 16px;font-size:13px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-ok{background:rgba(0,229,176,.12);color:var(--ok)}
.badge-info{background:rgba(0,194,255,.12);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:Manrope,sans-serif}
.btn-primary{background:var(--accent);color:#041018}.btn-primary:hover{opacity:.85}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:rgba(255,255,255,.1)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.unidade-block{margin-bottom:20px}
.unidade-block:last-child{margin-bottom:0}
.unidade-title{font-size:13px;font-weight:700;color:var(--accent);padding:12px 20px;background:rgba(0,194,255,.06)}
</style>
</head>
<body>
{% include "_farmacia_sidebar.html" %}

<main class="main">
  <div class="page-header">
    <div>
      <div class="page-title">Disponibilidade na Rede</div>
      <div class="page-sub">Veja em quais outras unidades da sua rede um medicamento tem estoque disponível</div>
    </div>
    <a href="/farmacia/gestao/" class="btn btn-ghost">← Gestão</a>
  </div>

  <div class="search-row">
    <input id="qMedicamento" placeholder="Digite o nome do medicamento (ex: Losartana)" onkeydown="if(event.key==='Enter')buscar()">
    <button class="btn btn-primary" onclick="buscar()">🔍 Buscar</button>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Resultado</span></div>
    <div id="resultado"><div class="empty">Digite o nome de um medicamento e clique em Buscar.</div></div>
  </div>
</main>

<script>
const E = sessionStorage.getItem("empresa_id") || localStorage.getItem("empresa_id") || "";
function csrfToken() { const m = document.cookie.match(/csrftoken=([^;]+)/); return m ? m[1] : ""; }
async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, {
    headers: { "X-CSRFToken": csrfToken(), "Content-Type": "application/json", "X-Empresa-ID": E, ...opts.headers },
    credentials: "include", ...opts
  });
  return res.json();
}

async function buscar() {
  const nome = document.getElementById("qMedicamento").value.trim();
  const box = document.getElementById("resultado");
  if (!nome) { box.innerHTML = '<div class="empty">Digite o nome de um medicamento.</div>'; return; }
  box.innerHTML = '<div class="empty">Buscando na rede…</div>';
  const d = await fetchJSON(`/api/farmacia/rede/disponibilidade/${encodeURIComponent(nome)}/`);
  const disp = d.disponibilidade || [];
  if (!disp.length) {
    box.innerHTML = `<div class="empty">Nenhuma outra unidade da rede tem "${d.medicamento || nome}" em estoque no momento (ou sua conta não faz parte de uma rede).</div>`;
    return;
  }
  box.innerHTML = disp.map(u => `
    <div class="unidade-block">
      <div class="unidade-title">🏪 ${u.unidade_nome}${u.cidade ? ` — ${u.cidade}/${u.estado || ''}` : ''}</div>
      <table>
        <thead><tr><th>Medicamento</th><th>Concentração</th><th>Disponível</th></tr></thead>
        <tbody>
          ${u.medicamentos.map(m => `<tr>
            <td>${m.nome}</td>
            <td>${m.concentracao || '—'}</td>
            <td><span class="badge badge-ok">${m.quantidade_disponivel} un.</span></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `).join("");
}
</script>
</body>
</html>
